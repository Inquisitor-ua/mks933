{% extends 'main/base.html' %}

{% load static %}

{% block title %}

{% endblock %}


{% block links %}
<link rel="stylesheet" href="{% static 'main/css/account.css' %}">
{% endblock %}


{% block header %}
    {% if user.is_authenticated %}    
        <h2>Account</h2>
    {% else %}
        <h2>Login</h2>
    {% endif %}
{% endblock %}


{% block content %}
<div class="form-block">
    <p class="form-title">Bei Konto anmelden</p>
    <form method="post">
        <button type="submit">Registrieren</button>
    </form>
</div>
{% endblock %}
